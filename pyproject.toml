[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-game-agent"
version = "0.1.0"
description = "Decision layer that plays hosted games through their agent APIs, with every move chosen by a logged Laya call"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "laya==0.4.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_agent = ["viewer/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
